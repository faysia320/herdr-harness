name: Harness CI

# HH 자체 QA는 바뀐 파일 시험만 독립 QA에서 실행하고 QA 실행 영수증을 쓰지 않는다(HH-020).
# 저장소 보호 규칙이 필수로 보는 job 이름(harness-ci (ubuntu-latest)/(windows-latest))만 유지하고, 단계는 수 초짜리 build 하나다.
# 검사를 더하지 않는다. main push·nightly 사후 검사는 두지 않는다.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    name: harness-ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/build.mjs
