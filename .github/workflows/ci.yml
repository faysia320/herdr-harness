name: Harness CI

# 전체 시험은 독립 QA가 Windows·Docker Linux에서 실행하고 PR 본문에 QA 실행 영수증을 남긴다.
# CI는 PR head에서 후보 지문을 다시 계산해 영수증과 저장소 정책(policy/qa-receipt.json)만 검사한다.
# 본문 수정(edited)에도 다시 실행한다. main push·nightly 사후 검사는 두지 않는다.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    name: harness-ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node bin/verify-qa-receipt.mjs
